# Configuration Supabase CLI (développement local : `supabase start`).
# Le projet distant se crée dans le tableau de bord, région UE (voir README).
project_id = "stacker"

[api]
enabled = true
port = 54321
# Seul le schéma public est exposé ; aucune table n'y est lisible par anon.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Non utilisé (verdict §1 : pas de Realtime pour le flux et le classement).
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
# URL de base des liens envoyés par email (production : https://<domaine>).
site_url = "http://localhost:5173"
# Seules ces URLs peuvent recevoir un lien de confirmation / récupération.
additional_redirect_urls = ["http://localhost:5173/app/auth/confirmer", "http://localhost:4173/app/auth/confirmer"]
# Jeton d'accès court (1 h), rafraîchissement à usage unique (rotation).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Lot 2 : inscription des stackers par email + mot de passe.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Mots de passe : 12 caractères minimum, minuscule + majuscule + chiffre.
# (La détection des mots de passe ayant fuité, HaveIBeenPwned, s'active
# dans le tableau de bord : Authentication > Providers > Email.)
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# Emails envoyés par heure (avec un SMTP personnalisé : Brevo).
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

# Anti-robot sur inscription, connexion, code, mot de passe oublié et renvoi.
# Désactivé en local ; en production : activé avec la clé SECRÈTE Turnstile.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Changer de mot de passe depuis une session ordinaire exige une réauthentification récente.
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Emails en français : lien (token_hash, vérifié par /app/auth/confirmer) + code à 6 chiffres.
[auth.email.template.confirmation]
subject = "Confirme ton adresse email — Stacker"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Choisis un nouveau mot de passe — Stacker"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Ton code de connexion — Stacker"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme ta nouvelle adresse email — Stacker"
content_path = "./supabase/templates/email_change.html"

# SMTP Brevo (production). En local, les emails arrivent dans Inbucket (port 54324).
# [auth.email.smtp]
# enabled = true
# host = "smtp-relay.brevo.com"
# port = 587
# user = "env(BREVO_SMTP_LOGIN)"
# pass = "env(BREVO_SMTP_KEY)"
# admin_email = "no-reply@<domaine>"
# sender_name = "Stacker"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "oneshot"
deno_version = 2

# Fonction publique protégée par Turnstile + rate limit + contrôle d'origine :
# pas de JWT utilisateur à ce stade (visiteurs non connectés).
[functions.waitlist-join]
enabled = true
verify_jwt = false
import_map = "./functions/waitlist-join/deno.json"
entrypoint = "./functions/waitlist-join/index.ts"

[analytics]
enabled = false

# Suppression du compte : JWT vérifié par la passerelle ET par la fonction
# (GET /auth/v1/user), connexion de moins de 10 minutes exigée.
[functions.account-delete]
enabled = true
verify_jwt = true
import_map = "./functions/account-delete/deno.json"
entrypoint = "./functions/account-delete/index.ts"


# Lot 3 : prospection et campagnes.
[functions.prospects-search]
enabled = true
verify_jwt = true
import_map = "./functions/prospects-search/deno.json"
entrypoint = "./functions/prospects-search/index.ts"

# Public (lien des emails et formulaire) : protégé par jeton, Turnstile et rate limit.
[functions.opposition-register]
enabled = true
verify_jwt = false
import_map = "./functions/opposition-register/deno.json"
entrypoint = "./functions/opposition-register/index.ts"

# Tâches planifiées : protégées par CRON_SECRET (en-tête x-cron-secret).
[functions.leads-enrich]
enabled = true
verify_jwt = false
import_map = "./functions/leads-enrich/deno.json"
entrypoint = "./functions/leads-enrich/index.ts"

[functions.campaign-run]
enabled = true
verify_jwt = false
import_map = "./functions/campaign-run/deno.json"
entrypoint = "./functions/campaign-run/index.ts"

[functions.mail-connect]
enabled = true
verify_jwt = true
import_map = "./functions/mail-connect/deno.json"
entrypoint = "./functions/mail-connect/index.ts"

# Retour de Google / Microsoft (navigateur) : protégé par l'état signé.
[functions.mail-callback]
enabled = true
verify_jwt = false
import_map = "./functions/mail-callback/deno.json"
entrypoint = "./functions/mail-callback/index.ts"

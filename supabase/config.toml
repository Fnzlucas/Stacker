# Configuration Supabase CLI (développement local : `supabase start`).
# Le projet distant se crée dans le tableau de bord, région UE (voir README).
project_id = "stacker"

[api]
enabled = true
port = 54321
# Seul le schéma public est exposé ; aucune table n'y est lisible par anon.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Non utilisé (verdict §1 : pas de Realtime pour le flux et le classement).
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# L'inscription des comptes stackers arrive au lot suivant (OTP email).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "oneshot"
deno_version = 2

# Fonction publique protégée par Turnstile + rate limit + contrôle d'origine :
# pas de JWT utilisateur à ce stade (visiteurs non connectés).
[functions.waitlist-join]
enabled = true
verify_jwt = false
import_map = "./functions/waitlist-join/deno.json"
entrypoint = "./functions/waitlist-join/index.ts"

[analytics]
enabled = false

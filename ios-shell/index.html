<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stacker</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #ececf0; font-family: -apple-system, system-ui, sans-serif; color: #121216; }
      main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 24px; color: #55555f; font-size: 15px; line-height: 1.45; }
      button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 24px; background: #121216; color: #fff; }
      .logo { width: 64px; height: 64px; display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1d1d22"/><rect x="21" y="25" width="58" height="12.5" rx="6.25" fill="#3dd068"/><rect x="21" y="43.75" width="58" height="12.5" rx="6.25" fill="#7b7ef0"/><rect x="21" y="62.5" width="58" height="12.5" rx="6.25" fill="#f5a31e"/></svg>
        <h1>Pas de connexion</h1>
        <p>Stacker a besoin d’internet pour charger tes prospects et tes gains.<br />Vérifie ton réseau, puis réessaie.</p>
        <button type="button" onclick="location.href = 'https://stacker-topaz.vercel.app/app'">Réessayer</button>
      </div>
    </main>
  </body>
</html>
